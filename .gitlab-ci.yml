variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"

stages:
  - version
  - test
  - quality
  - build
  - publish
  - infra
  - deploy

version:
  stage: version
  image: node:20
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - npm ci
  script:
    - npx semantic-release
    - test -f version.env || echo "VERSION=" > version.env
  artifacts:
    reports:
      dotenv: version.env

test-front:
  image: cypress/browsers:latest
  stage: test
  script:
    - cd front
    - npm ci
    - CHROME_BIN=/opt/google/chrome/chrome npx @angular/cli test --no-watch --no-progress --browsers=ChromeHeadlessNoSandbox --code-coverage
  artifacts:
    paths:
      - front/coverage/microcrm/lcov.info
    expire_in: 1 hour

test-back:
  image: gradle:jdk17
  stage: test
  script:
    - cd back
    - ./gradlew test
  artifacts:
    paths:
      - back/build/reports/jacoco/test/jacocoTestReport.xml
    expire_in: 1 hour

sonarqube-back:
  stage: quality
  image: gradle:jdk17
  needs:
    - job: test-back
      artifacts: true
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - cd back
    - ./gradlew sonar
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

sonarqube-front:
  stage: quality
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  needs:
    - job: test-front
      artifacts: true
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - cd front
    - sonar-scanner
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

build-front:
  image: node
  stage: build
  script:
    - cd front
    - npm ci
    - npx @angular/cli build --optimization

build-back:
  image: gradle:jdk17
  stage: build
  script:
    - cd back
    - ./gradlew build

publish-images:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    TRIVY_VERSION: "0.54.1"
  needs:
    - job: version
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - |
      if [ -z "$VERSION" ]; then
        echo "Aucune nouvelle version détectée, skip du build d'images."
        exit 0
      fi
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build --target front -t "$CI_REGISTRY_IMAGE/front:$VERSION" -t "$CI_REGISTRY_IMAGE/front:latest" .
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:$TRIVY_VERSION image --exit-code 1 --severity CRITICAL "$CI_REGISTRY_IMAGE/front:$VERSION"
    - docker push "$CI_REGISTRY_IMAGE/front:$VERSION"
    - docker push "$CI_REGISTRY_IMAGE/front:latest"

    - docker build --target back -t "$CI_REGISTRY_IMAGE/back:$VERSION" -t "$CI_REGISTRY_IMAGE/back:latest" .
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:$TRIVY_VERSION image --exit-code 1 --severity CRITICAL "$CI_REGISTRY_IMAGE/back:$VERSION"
    - docker push "$CI_REGISTRY_IMAGE/back:$VERSION"
    - docker push "$CI_REGISTRY_IMAGE/back:latest"

    - docker build --target standalone -t "$CI_REGISTRY_IMAGE/standalone:$VERSION" -t "$CI_REGISTRY_IMAGE/standalone:latest" .
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:$TRIVY_VERSION image --exit-code 1 --severity CRITICAL "$CI_REGISTRY_IMAGE/standalone:$VERSION"
    - docker push "$CI_REGISTRY_IMAGE/standalone:$VERSION"
    - docker push "$CI_REGISTRY_IMAGE/standalone:latest"

terraform-plan:
  stage: infra
  image: hashicorp/terraform:1.15
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - cd terraform
    - terraform init
    - terraform plan

terraform-apply:
  stage: infra
  image: hashicorp/terraform:1.15
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - cd terraform
    - terraform init
    - terraform apply -auto-approve

ansible-bootstrap:
  stage: infra
  image: alpine/k8s:1.30.2
  needs:
    - job: terraform-apply
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache py3-pip
    - pip install --break-system-packages ansible kubernetes
    - ansible-galaxy collection install -r ansible/requirements.yml
    - aws eks update-kubeconfig --region eu-west-3 --name orion-eks
  script:
    - ansible-playbook -i ansible/inventory.ini ansible/bootstrap-k8s.yml
        -e "registry_username=$REGISTRY_USERNAME"
        -e "registry_password=$REGISTRY_PASSWORD"

deploy:
  stage: deploy
  image: alpine/k8s:1.30.2
  needs:
    - job: version
      artifacts: true
    - job: publish-images
    - job: ansible-bootstrap
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - |
      if [ -z "$VERSION" ]; then
        echo "Aucune nouvelle version détectée, skip du déploiement."
        exit 0
      fi
    - aws eks update-kubeconfig --region eu-west-3 --name orion-eks
  script:
    - helm upgrade --install orion helm/orion/ --namespace orion
        --set backend.tag="$VERSION" --set frontend.tag="$VERSION"
        --wait --timeout 5m