workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"

stages:
  - version
  - test
  - quality
  - build
  - publish
  - infra
  - monitoring
  - deploy

version:
  stage: version
  image: node:20
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - npm ci
  script:
    - npx semantic-release
    - test -f version.env || echo "VERSION=" > version.env
  artifacts:
    reports:
      dotenv: version.env

test-front:
  image: cypress/browsers:latest
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  script:
    - cd front
    - npm ci
    - CHROME_BIN=/opt/google/chrome/chrome npx @angular/cli test --no-watch --no-progress --browsers=ChromeHeadlessNoSandbox --code-coverage
  artifacts:
    paths:
      - front/coverage/microcrm/lcov.info
    expire_in: 1 hour

test-back:
  image: gradle:jdk17
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  script:
    - cd back
    - ./gradlew test
  artifacts:
    paths:
      - back/build/reports/jacoco/test/jacocoTestReport.xml
    expire_in: 1 hour

sonarqube-back:
  stage: quality
  image: gradle:jdk17
  needs:
    - job: test-back
      artifacts: true
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - cd back
    - ./gradlew sonar
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

sonarqube-front:
  stage: quality
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  needs:
    - job: test-front
      artifacts: true
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - cd front
    - sonar-scanner
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

build-front:
  image: node
  stage: build
  script:
    - cd front
    - npm ci
    - npx @angular/cli build --optimization

build-back:
  image: gradle:jdk17
  stage: build
  script:
    - cd back
    - ./gradlew build

publish-images:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    TRIVY_VERSION: "0.54.1"
  needs:
    - job: version
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - |
      if [ -z "$VERSION" ]; then
        echo "Aucune nouvelle version détectée, skip du build d'images."
        exit 0
      fi
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build --target front -t "$CI_REGISTRY_IMAGE/front:$VERSION" -t "$CI_REGISTRY_IMAGE/front:latest" .
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:$TRIVY_VERSION image --exit-code 1 --severity CRITICAL "$CI_REGISTRY_IMAGE/front:$VERSION"
    - docker push "$CI_REGISTRY_IMAGE/front:$VERSION"
    - docker push "$CI_REGISTRY_IMAGE/front:latest"

    - docker build --target back -t "$CI_REGISTRY_IMAGE/back:$VERSION" -t "$CI_REGISTRY_IMAGE/back:latest" .
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:$TRIVY_VERSION image --exit-code 1 --severity CRITICAL "$CI_REGISTRY_IMAGE/back:$VERSION"
    - docker push "$CI_REGISTRY_IMAGE/back:$VERSION"
    - docker push "$CI_REGISTRY_IMAGE/back:latest"

    - docker build --target standalone -t "$CI_REGISTRY_IMAGE/standalone:$VERSION" -t "$CI_REGISTRY_IMAGE/standalone:latest" .
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:$TRIVY_VERSION image --exit-code 1 --severity CRITICAL "$CI_REGISTRY_IMAGE/standalone:$VERSION"
    - docker push "$CI_REGISTRY_IMAGE/standalone:$VERSION"
    - docker push "$CI_REGISTRY_IMAGE/standalone:latest"

terraform-plan:
  stage: infra
  image:
    name: hashicorp/terraform:1.15
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - cd terraform
    - terraform init
    - terraform plan

terraform-apply:
  stage: infra
  image:
    name: hashicorp/terraform:1.15
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - cd terraform
    - terraform init
    - terraform apply -auto-approve

ansible-bootstrap:
  stage: infra
  image: alpine/k8s:1.30.2
  needs:
    - job: terraform-apply
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache py3-pip
    - pip install --break-system-packages ansible kubernetes
    - ansible-galaxy collection install -r ansible/requirements.yml
    - export KUBECONFIG=$KUBE_CONFIG
  script:
    - ansible-playbook -i ansible/inventory.ini ansible/bootstrap-k8s.yml
        -e "registry_username=$REGISTRY_USERNAME"
        -e "registry_password=$REGISTRY_PASSWORD"

deploy:
  stage: deploy
  image: alpine/k8s:1.30.2
  needs:
    - job: version
      artifacts: true
    - job: publish-images
    - job: ansible-bootstrap
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - |
      if [ -z "$VERSION" ]; then
        echo "Aucune nouvelle version détectée, skip du déploiement."
        exit 0
      fi
    - export KUBECONFIG=$KUBE_CONFIG
  script:
    - helm upgrade --install orion helm/orion/ --namespace orion
        --set backend.tag="$VERSION" --set frontend.tag="$VERSION"
        --atomic --timeout 5m

monitoring-deploy:
  stage: monitoring
  image:
    name: alpine/k8s:1.30.2
  script:
    - export KUBECONFIG=$KUBE_CONFIG
    - helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
    - helm repo add grafana https://grafana.github.io/helm-charts
    - helm repo update
    - kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
    - >
      helm upgrade --install loki-stack grafana/loki-stack
      --namespace monitoring
      -f helm/monitoring/loki-stack-values.yaml
      --wait --timeout 10m
    - >
      helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack
      --namespace monitoring
      -f helm/monitoring/kube-prometheus-stack-values.yaml
      --set grafana.adminPassword=$GRAFANA_ADMIN_PASSWORD
      --wait --timeout 10m
    - >
      helm upgrade --install prometheus-pushgateway prometheus-community/prometheus-pushgateway
      --namespace monitoring
      -f helm/monitoring/pushgateway-values.yaml
      --wait --timeout 5m
    - |
      for f in helm/monitoring/dashboards/*.json; do
        [ -e "$f" ] || continue
        name=$(basename "$f" .json)
        kubectl create configmap "grafana-dashboard-$name" \
          --from-file="dashboard.json=$f" -n monitoring \
          --dry-run=client -o yaml | \
          kubectl label --local -f - grafana_dashboard=1 -o yaml | \
          kubectl apply -f -
      done
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  needs:
    - job: terraform-apply
      optional: true

dora-metrics:
  stage: monitoring
  image: alpine/k8s:1.30.2
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  variables:
    PUSHGATEWAY_URL: "http://localhost:9091"
    DORA_WINDOW_DAYS: "30"
  before_script:
    - apk add --no-cache python3 py3-pip
    - pip install --break-system-packages requests prometheus_client
    - export KUBECONFIG=$KUBE_CONFIG
    - kubectl -n monitoring port-forward svc/prometheus-pushgateway 9091:9091 &
    - sleep 3
  script:
    - python3 scripts/dora_metrics.py

export-dashboards:
  stage: monitoring
  image: alpine/k8s:1.30.2
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  variables:
    GRAFANA_URL: "http://localhost:3000"
  before_script:
    - apk add --no-cache curl jq git
    - export KUBECONFIG=$KUBE_CONFIG
    - kubectl -n monitoring port-forward svc/kube-prometheus-stack-grafana 3000:80 &
    - sleep 3
  script:
    - mkdir -p helm/monitoring/dashboards
    - |
      UIDS=$(curl -s -u admin:$GRAFANA_ADMIN_PASSWORD "$GRAFANA_URL/api/search?type=dash-db" | jq -r '.[].uid')
      for uid in $UIDS; do
        SLUG=$(curl -s -u admin:$GRAFANA_ADMIN_PASSWORD "$GRAFANA_URL/api/dashboards/uid/$uid" | jq -r '.dashboard.title' | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9]+#-#g; s#^-+|-+$##g')
        curl -s -u admin:$GRAFANA_ADMIN_PASSWORD "$GRAFANA_URL/api/dashboards/uid/$uid" | jq '.dashboard' > "helm/monitoring/dashboards/${SLUG}.json"
      done
    - git config user.email "ci@orion.local"
    - git config user.name "GitLab CI"
    - git remote set-url origin "https://oauth2:${GIT_PUSH_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
    - git add helm/monitoring/dashboards/
    - |
      if git diff --cached --quiet; then
        echo "Aucun changement de dashboard à sauvegarder."
      else
        git commit -m "chore(monitoring): sauvegarde automatique des dashboards Grafana [skip ci]"
        git fetch origin main
        git rebase origin/main
        git push origin HEAD:main
      fi