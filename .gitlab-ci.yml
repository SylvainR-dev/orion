variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"

stages:
  - version
  - test
  - quality
  - build
  - publish

version:
  stage: version
  image: node:20
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - npm ci
  script:
    - npx semantic-release
    - test -f version.env || echo "VERSION=" > version.env
  artifacts:
    reports:
      dotenv: version.env

test-front:
  image: cypress/browsers:latest
  stage: test
  script:
    - cd front
    - npm ci
    - CHROME_BIN=/opt/google/chrome/chrome npx @angular/cli test --no-watch --no-progress --browsers=ChromeHeadlessNoSandbox

test-back:
  image: gradle:jdk17
  stage: test
  script:
    - cd back
    - ./gradlew test

sonarqube-back:
  stage: quality
  image: gradle:jdk17
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - cd back
    - ./gradlew sonar
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

sonarqube-front:
  stage: quality
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - cd front
    - sonar-scanner
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

build-front:
  image: node
  stage: build
  script:
    - cd front
    - npm ci
    - npx @angular/cli build --optimization

build-back:
  image: gradle:jdk17
  stage: build
  script:
    - cd back
    - ./gradlew build

publish-images:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    TRIVY_VERSION: "0.54.1"
  needs:
    - job: version
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - |
      if [ -z "$VERSION" ]; then
        echo "Aucune nouvelle version détectée, skip du build d'images."
        exit 0
      fi
    - apk add --no-cache curl
    - curl -fsSL -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_linux-amd64.tar.gz"
    - tar zxvf trivy.tar.gz -C /usr/local/bin trivy
    - rm trivy.tar.gz
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build --target front -t "$CI_REGISTRY_IMAGE/front:$VERSION" -t "$CI_REGISTRY_IMAGE/front:latest" .
    - trivy image --exit-code 1 --severity CRITICAL "$CI_REGISTRY_IMAGE/front:$VERSION"
    - docker push "$CI_REGISTRY_IMAGE/front:$VERSION"
    - docker push "$CI_REGISTRY_IMAGE/front:latest"

    - docker build --target back -t "$CI_REGISTRY_IMAGE/back:$VERSION" -t "$CI_REGISTRY_IMAGE/back:latest" .
    - trivy image --exit-code 1 --severity CRITICAL "$CI_REGISTRY_IMAGE/back:$VERSION"
    - docker push "$CI_REGISTRY_IMAGE/back:$VERSION"
    - docker push "$CI_REGISTRY_IMAGE/back:latest"

    - docker build --target standalone -t "$CI_REGISTRY_IMAGE/standalone:$VERSION" -t "$CI_REGISTRY_IMAGE/standalone:latest" .
    - trivy image --exit-code 1 --severity CRITICAL "$CI_REGISTRY_IMAGE/standalone:$VERSION"
    - docker push "$CI_REGISTRY_IMAGE/standalone:$VERSION"
    - docker push "$CI_REGISTRY_IMAGE/standalone:latest"