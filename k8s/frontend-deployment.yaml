apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-frontend
  namespace: orion
  labels:
    app: orion-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orion-frontend
  template:
    metadata:
      labels:
        app: orion-frontend
    spec:
      imagePullSecrets:
        - name: gitlab-registry-secret
      containers:
        - name: frontend
          image: registry.gitlab.com/sylvainr-dev-group/projet-6-demarche-devops/front:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: orion-frontend
  namespace: orion
spec:
  selector:
    app: orion-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP