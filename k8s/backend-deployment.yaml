apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-backend
  namespace: orion
  labels:
    app: orion-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orion-backend
  template:
    metadata:
      labels:
        app: orion-backend
    spec:
      imagePullSecrets:
        - name: gitlab-registry-secret
      containers:
        - name: backend
          image: registry.gitlab.com/sylvainr-dev-group/projet-6-demarche-devops/back:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: orion-backend
  namespace: orion
spec:
  selector:
    app: orion-backend
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP