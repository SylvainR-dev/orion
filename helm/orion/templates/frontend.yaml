apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-frontend
  namespace: {{ .Values.namespace }}
  labels:
    app: orion-frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: orion-frontend
  template:
    metadata:
      labels:
        app: orion-frontend
    spec:
      imagePullSecrets:
        - name: {{ .Values.imagePullSecretName }}
      containers:
        - name: frontend
          image: "{{ .Values.imageRegistry }}/{{ .Values.frontend.image }}:{{ .Values.frontend.tag }}"
          ports:
            - containerPort: {{ .Values.frontend.port }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.frontend.port }}
            initialDelaySeconds: {{ .Values.frontend.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.frontend.probes.periodSeconds }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.frontend.port }}
            initialDelaySeconds: {{ add .Values.frontend.probes.initialDelaySeconds 5 }}
            periodSeconds: {{ add .Values.frontend.probes.periodSeconds 5 }}
---
apiVersion: v1
kind: Service
metadata:
  name: orion-frontend
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: orion-frontend
  ports:
    - port: {{ .Values.frontend.port }}
      targetPort: {{ .Values.frontend.port }}
  type: ClusterIP