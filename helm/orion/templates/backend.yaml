apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-backend
  namespace: {{ .Values.namespace }}
  labels:
    app: orion-backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: orion-backend
  template:
    metadata:
      labels:
        app: orion-backend
    spec:
      imagePullSecrets:
        - name: {{ .Values.imagePullSecretName }}
      containers:
        - name: backend
          image: "{{ .Values.imageRegistry }}/{{ .Values.backend.image }}:{{ .Values.backend.tag }}"
          ports:
            - containerPort: {{ .Values.backend.port }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.backend.port }}
            initialDelaySeconds: {{ .Values.backend.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.periodSeconds }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.backend.port }}
            initialDelaySeconds: {{ add .Values.backend.probes.initialDelaySeconds 10 }}
            periodSeconds: {{ add .Values.backend.probes.periodSeconds 5 }}
---
apiVersion: v1
kind: Service
metadata:
  name: orion-backend
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: orion-backend
  ports:
    - port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
  type: ClusterIP