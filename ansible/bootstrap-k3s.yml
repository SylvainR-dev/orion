---
# Installe k3s sur l'instance Orion (tag Name=orion-k3s) et rapatrie le kubeconfig.
# Lance via : make install (l'IP est fournie par le Makefile).
# L'API k3s n'est jamais exposee : acces par tunnel SSH vers 127.0.0.1:6443,
# donc le kubeconfig garde l'adresse 127.0.0.1 d'origine (pas de tls-san a gerer).

- name: Installer k3s sur l'instance Orion
  hosts: all
  become: true
  tasks:
    - name: Creer le dossier de configuration k3s
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    - name: Desactiver Traefik et ServiceLB (inutiles ici, economie de RAM)
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        content: |
          disable:
            - traefik
            - servicelb
        mode: "0644"

    - name: Installer k3s (idempotent, ne reinstalle pas si deja present)
      ansible.builtin.shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Attendre que le kubeconfig soit genere
      ansible.builtin.wait_for:
        path: /etc/rancher/k3s/k3s.yaml
        timeout: 120

    - name: Rapatrier le kubeconfig en local
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ playbook_dir }}/kubeconfig-orion.yaml"
        flat: true
