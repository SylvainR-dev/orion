name: CI

# GitLab: workflow:rules (MR + branche main)
on:
  push:
    branches: [main]
  pull_request:

env:
  SONAR_USER_HOME: ${{ github.workspace }}/.sonar
  SONAR_HOST_URL: https://sonarcloud.io

jobs:
  # ---------- stage: version ----------
  version:
    needs: [sonarqube-back, sonarqube-front, gitleaks, trivy-config]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.ver.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release
          test -f version.env || echo "VERSION=" > version.env
      - id: ver
        run: cat version.env >> "$GITHUB_OUTPUT"

  # ---------- stage: test ----------
  test-front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tests Karma + couverture
        working-directory: front
        run: |
          npm ci
          CHROME_BIN=/usr/bin/google-chrome npx @angular/cli test --no-watch --no-progress --browsers=ChromeHeadlessNoSandbox --code-coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-front
          path: front/coverage/microcrm/lcov.info
          retention-days: 1

  test-back:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Tests JUnit + Jacoco
        working-directory: back
        run: ./gradlew test
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-back
          path: back/build/reports/jacoco/test/jacocoTestReport.xml
          retention-days: 1

  # ---------- stage: quality ----------
  sonarqube-back:
    needs: [test-back]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: .sonar/cache
          key: sonarqube-back
      - uses: actions/download-artifact@v4
        with:
          name: coverage-back
          path: back/build/reports/jacoco/test/
      - name: Analyse Sonar backend
        working-directory: back
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar

  sonarqube-front:
    needs: [test-front]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: .sonar/cache
          key: sonarqube-front
      - uses: actions/download-artifact@v4
        with:
          name: coverage-front
          path: front/coverage/microcrm/
      - uses: SonarSource/sonarqube-scan-action@v5
        with:
          projectBaseDir: front
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ---------- stage: build ----------
  build-front:
    needs: [sonarqube-front, sonarqube-back, version]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: front
        run: |
          npm ci
          npx @angular/cli build --optimization

  build-back:
    needs: [sonarqube-front, sonarqube-back, version]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - working-directory: back
        run: ./gradlew build

  # ---------- stage: security (DevSecOps) ----------
  # Detection de secrets dans le code et dans tout l'historique git.
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Scan de la configuration d'infrastructure (chart Helm + Terraform).
  # Premiere version NON BLOQUANTE (EXIT_CODE "0") : on lit le rapport, on corrige
  # ou on justifie chaque constat, puis on passera EXIT_CODE a "1" pour bloquer.
  trivy-config:
    runs-on: ubuntu-latest
    env:
      TRIVY_VERSION: "0.54.1"
      EXIT_CODE: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Trivy config (helm, terraform-orion)
        run: |
          rc=0
          for d in helm terraform-orion; do
            echo "=== $d ==="
            docker run --rm -v "$PWD:/src:ro" aquasec/trivy:$TRIVY_VERSION config --exit-code $EXIT_CODE --severity HIGH,CRITICAL "/src/$d" || rc=1
          done
          exit $rc

  # ---------- stage: publish ----------
  # Depend de "version" (apres tests, Sonar et securite) et des builds.
  publish-images:
    needs: [version, build-front, build-back]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TRIVY_VERSION: "0.54.1"
      IMAGE: ghcr.io/sylvainr-dev/orion
      LABEL: org.opencontainers.image.source=https://github.com/SylvainR-dev/orion
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: front
        run: |
          docker build --label "$LABEL" --target front -t "$IMAGE/front:$VERSION" -t "$IMAGE/front:latest" .
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:$TRIVY_VERSION image --exit-code 1 --severity CRITICAL "$IMAGE/front:$VERSION"
          docker push "$IMAGE/front:$VERSION"
          docker push "$IMAGE/front:latest"
      - name: back
        run: |
          docker build --label "$LABEL" --target back -t "$IMAGE/back:$VERSION" -t "$IMAGE/back:latest" .
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/.trivyignore:/.trivyignore:ro" aquasec/trivy:$TRIVY_VERSION image --exit-code 1 --severity CRITICAL --ignorefile /.trivyignore "$IMAGE/back:$VERSION"
          docker push "$IMAGE/back:$VERSION"
          docker push "$IMAGE/back:latest"
      - name: standalone
        run: |
          docker build --label "$LABEL" --target standalone -t "$IMAGE/standalone:$VERSION" -t "$IMAGE/standalone:latest" .
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/.trivyignore:/.trivyignore:ro" aquasec/trivy:$TRIVY_VERSION image --exit-code 1 --severity CRITICAL --ignorefile /.trivyignore "$IMAGE/standalone:$VERSION"
          docker push "$IMAGE/standalone:$VERSION"
          docker push "$IMAGE/standalone:latest"

  # ---------- stage: deploy (CD) ----------
  # Deploie la version publiee sur l'instance k3s via AWS SSM : aucun port ouvert,
  # authentification OIDC (aucune cle AWS stockee dans GitHub).
  # Environment "production" : approbation manuelle requise avant l'execution.
  deploy:
    needs: [version, publish-images]
    if: ${{ !failure() && !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.version.outputs.version != '' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::476646938402:role/orion-github-deploy
          aws-region: eu-west-3
      - name: Verifier que l'instance tourne
        run: |
          ID=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=orion-k3s" "Name=instance-state-name,Values=running" --query "Reservations[0].Instances[0].InstanceId" --output text)
          if [ -z "$ID" ] || [ "$ID" = "None" ]; then
            echo "Instance orion-k3s eteinte : lance make up, puis relance ce job (Re-run)."
            exit 1
          fi
          echo "INSTANCE_ID=$ID" >> "$GITHUB_ENV"
      - name: Deployer via SSM
        run: |
          cat > params.json << EOF
          {"commands": [
            "set -e",
            "export HOME=/root",
            "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
            "rm -rf /tmp/orion-deploy",
            "git clone --depth 1 --branch v$VERSION https://github.com/SylvainR-dev/orion.git /tmp/orion-deploy",
            "helm upgrade --install orion /tmp/orion-deploy/helm/orion --namespace orion --create-namespace --set backend.tag=$VERSION --set frontend.tag=$VERSION --atomic --timeout 5m",
            "kubectl -n orion get pods"
          ]}
          EOF
          CMD_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --comment "Deploy Orion $VERSION" --parameters file://params.json --query "Command.CommandId" --output text)
          echo "Commande SSM : $CMD_ID"
          STATUS=Pending
          for i in $(seq 1 60); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            echo "[$i] $STATUS"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
          [ "$STATUS" = "Success" ]
