plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.5'
	id 'io.spring.dependency-management' version '1.1.4'
	id 'com.adarshr.test-logger' version '4.0.0'
	id 'org.sonarqube' version '7.3.1.8318'
}

group = 'com.openclassroom.devops.orion'
version = '0.0.1-SNAPSHOT'

ext['tomcat.version'] = '10.1.35'

java {
	sourceCompatibility = '17'
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-rest'
	implementation 'ro.polak:spring-boot-data-fixtures:0.2.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	runtimeOnly 'org.hsqldb:hsqldb'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}

sonar {
	properties {
		property "sonar.projectKey", "sylvainr-dev-group_projet-6-demarche-devops"
		property "sonar.organization", "sylvainr-dev-group"
	}
}